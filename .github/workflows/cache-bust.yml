name: Atualizar cache dos assets estáticos

on:
  push:
    branches: [main]
    paths:
      - 'styles.css'
      - 'siglab.css'
      - 'siglab-app.js'
      - 'siglab-auth.js'
      - 'siglab-master.js'
      - 'reservations.js'
      - 'supabase-config.js'
      - 'scripts/bump-cache-version.mjs'

permissions:
  contents: write

concurrency:
  group: cache-bust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Atualizar hashes de cache no HTML
        run: node scripts/bump-cache-version.mjs

      - name: Commit se houver mudança
        run: |
          if git diff --quiet -- index.html; then
            echo "Nada mudou, nada para commitar."
            exit 0
          fi
          git config user.name "siglab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "chore: atualiza cache dos assets [skip ci]"
          git push
